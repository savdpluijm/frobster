<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frobster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e; color: #fff;
      font-family: -apple-system, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 2.2rem; letter-spacing: 0.18em; margin-bottom: 2.5rem; color: #e94560; font-weight: 800; }
    #scanner-screen { display: flex; flex-direction: column; align-items: center; }
    #scan-btn {
      width: 130px; height: 130px; border-radius: 50%;
      background: #e94560; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 50px rgba(233,69,96,0.45);
      transition: transform 0.1s; touch-action: manipulation;
    }
    #scan-btn:active { transform: scale(0.91); }
    #scan-btn svg { width: 52px; height: 52px; fill: #fff; }
    #scan-label { margin-top: 1.5rem; font-size: 1rem; color: #888; }
    #camera-wrap { display: none; flex-direction: column; align-items: center; width: 100%; }
    #camera-wrap.active { display: flex; }
    #video { width: 280px; height: 280px; border-radius: 16px; object-fit: cover; border: 3px solid #e94560; }
    #canvas { display: none; }
    #scan-hint { margin-top: 1rem; font-size: 0.9rem; color: #888; }
    #stop-btn {
      margin-top: 1.2rem; background: none; border: 1px solid #555;
      color: #aaa; padding: 0.5rem 1.5rem; border-radius: 999px;
      cursor: pointer; font-size: 0.9rem;
    }
    #player-screen { display: none; flex-direction: column; align-items: center; }
    #player-screen.active { display: flex; }
    #player-frame {
      width: 360px; max-width: 96vw; height: 80px;
      border-radius: 16px; overflow: hidden;
      background: #1a1a2e;
      box-shadow: 0 0 40px rgba(233,69,96,0.25);
      position: relative;
    }
    #player-frame::before {
      content: "FROBSTER";
      position: absolute; left: 24px; top: 50%; transform: translateY(-50%);
      font-size: 1.2rem; letter-spacing: 0.18em; color: #e94560; font-weight: 800;
      pointer-events: none; z-index: 1;
    }
    /* iframe wordt gepositioneerd zodat alleen het rechter play-knop-venster zichtbaar is via clip-path */
    #spotify-mount { position: absolute; right: 0; top: 0; width: 360px; height: 80px; }
    #spotify-mount iframe {
      width: 360px !important; height: 80px !important; border: 0;
      /* clip alleen 70px aan de rechterkant â play-knop sectie */
      clip-path: inset(0 4px 0 290px);
      -webkit-clip-path: inset(0 4px 0 290px);
    }
    #restart-btn {
      margin-top: 1.2rem; background: #e94560; border: none;
      color: #fff; padding: 0.7rem 1.6rem; border-radius: 999px;
      cursor: pointer; font-size: 0.95rem; font-weight: 600;
      box-shadow: 0 0 20px rgba(233,69,96,0.35);
      touch-action: manipulation;
      display: flex; align-items: center; gap: 0.5rem;
    }
    #restart-btn:active { transform: scale(0.96); }
    #restart-btn svg { width: 18px; height: 18px; fill: #fff; }
    #msg { margin-top: 1rem; font-size: 0.9rem; color: #888; min-height: 1.2rem; text-align: center; padding: 0 2rem; max-width: 320px; }
    #new-scan-btn {
      margin-top: 1.5rem; background: none; border: 1px solid #555;
      color: #aaa; padding: 0.5rem 1.5rem; border-radius: 999px;
      cursor: pointer; font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>FROBSTER</h1>

  <div id="scanner-screen">
    <button id="scan-btn" aria-label="Scan kaartje">
      <svg viewBox="0 0 24 24"><path d="M9.5 6.5v3h-3v-3h3M11 5H5v6h6V5zm-1.5 9.5v3h-3v-3h3M11 13H5v6h6v-6zm6.5-6.5v3h-3v-3h3M19 5h-6v6h6V5zm-6 8h1.5v1.5H13V13zm1.5 1.5H16V16h-1.5v-1.5zM16 13h1.5v1.5H16V13zm-3 3h1.5v1.5H13V16zm1.5 1.5H16V19h-1.5v-1.5zM16 16h1.5v1.5H16V16zm1.5-1.5H19V16h-1.5v-1.5zm0 3H19V19h-1.5v-1.5zM22 7h-2V4h-3V2h5v5zm0 15v-5h-2v3h-3v2h5zM2 22h5v-2H4v-3H2v5zM2 2v5h2V4h3V2H2z"/></svg>
    </button>
    <p id="scan-label">Scan een kaartje</p>
    <div id="camera-wrap">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="canvas"></canvas>
      <p id="scan-hint">Richt de camera op de QR-code</p>
      <button id="stop-btn">Annuleren</button>
    </div>
  </div>

  <div id="player-screen">
    <div id="player-frame">
      <div id="spotify-mount"></div>
    </div>
    <button id="restart-btn" aria-label="Start vanaf het begin">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      Start vanaf begin
    </button>
    <div id="msg"></div>
    <button id="new-scan-btn">Nieuw kaartje scannen</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
  <script>
    const params = new URLSearchParams(location.search);
    let cardId = params.get("id");

    const scannerScreen = document.getElementById("scanner-screen");
    const playerScreen  = document.getElementById("player-screen");
    const cameraWrap    = document.getElementById("camera-wrap");
    const video         = document.getElementById("video");
    const canvas        = document.getElementById("canvas");
    const scanBtn       = document.getElementById("scan-btn");
    const scanLabel     = document.getElementById("scan-label");
    const stopBtn       = document.getElementById("stop-btn");
    const newScanBtn    = document.getElementById("new-scan-btn");
    const restartBtn    = document.getElementById("restart-btn");
    const msgEl         = document.getElementById("msg");

    let stream = null, scanLoop = null, trackData = null;
    let IFrameAPI = null, controller = null, pendingTrackId = null;
    let currentTrackId = null;

    fetch("data.json").then(r => r.json()).then(d => {
      trackData = d;
      if (cardId) startPlayer(cardId);
    });

    window.onSpotifyIframeApiReady = (api) => {
      IFrameAPI = api;
      if (pendingTrackId) loadTrack(pendingTrackId);
    };

    scanBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
    newScanBtn.addEventListener("click", () => {
      if (controller) { try { controller.pause(); } catch(e){} }
      playerScreen.classList.remove("active");
      scannerScreen.style.display = "flex";
    });

    // Restart-knop: gooi iframe weg en mount 'm opnieuw â omzeilt Spotify's smart-resume cache
    restartBtn.addEventListener("click", () => {
      if (!currentTrackId) return;
      if (controller) { try { controller.destroy(); } catch(e){} }
      controller = null;
      loadTrack(currentTrackId);
    });

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(s => {
          stream = s; video.srcObject = s;
          cameraWrap.classList.add("active");
          scanBtn.style.display = "none"; scanLabel.style.display = "none";
          scanLoop = requestAnimationFrame(tick);
        })
        .catch(() => alert("Kan camera niet openen. Geef toestemming in je browser."));
    }

    function stopCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      cancelAnimationFrame(scanLoop);
      cameraWrap.classList.remove("active");
      scanBtn.style.display = ""; scanLabel.style.display = "";
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const ctx = canvas.getContext("2d");
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(img.data, img.width, img.height);
        if (code && code.data.includes("frobster")) {
          try {
            const id = new URL(code.data).searchParams.get("id");
            if (id) { stopCamera(); startPlayer(id); return; }
          } catch(e) {}
        }
      }
      scanLoop = requestAnimationFrame(tick);
    }

    function startPlayer(id) {
      cardId = id;
      scannerScreen.style.display = "none";
      playerScreen.classList.add("active");
      msgEl.textContent = "";

      const track = trackData?.find(t => t.id === id);
      if (!track || !track.track_id) {
        msgEl.textContent = "Kaart niet gevonden.";
        return;
      }
      if (IFrameAPI) loadTrack(track.track_id);
      else pendingTrackId = track.track_id;
    }

    function loadTrack(trackId) {
      pendingTrackId = null;
      currentTrackId = trackId;
      const mount = document.getElementById("spotify-mount");
      mount.innerHTML = "<div></div>";
      IFrameAPI.createController(
        mount.firstElementChild,
        { uri: `spotify:track:${trackId}` },
        (ctrl) => {
          controller = ctrl;
          ctrl.addListener("ready", () => {
            try { ctrl.seek(0); } catch(e){}
            setTimeout(() => { try { ctrl.seek(0); } catch(e){} }, 500);
          });
        }
      );
    }
  </script>
</body>
</html>
