<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frobster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; user-select: none; -webkit-tap-highlight-color: transparent; }
    h1 { font-size: 2.2rem; letter-spacing: 0.18em; margin-bottom: 2.5rem; color: #e94560; font-weight: 800; }
    #scanner-screen { display: flex; flex-direction: column; align-items: center; }
    #scan-btn { width: 130px; height: 130px; border-radius: 50%; background: #e94560; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 50px rgba(233,69,96,0.45); transition: transform 0.1s; touch-action: manipulation; }
    #scan-btn:active { transform: scale(0.91); }
    #scan-btn svg { width: 52px; height: 52px; fill: #fff; }
    #scan-label { margin-top: 1.5rem; font-size: 1rem; color: #888; }
    #camera-wrap { display: none; flex-direction: column; align-items: center; width: 100%; }
    #camera-wrap.active { display: flex; }
    #video { width: 280px; height: 280px; border-radius: 16px; object-fit: cover; border: 3px solid #e94560; }
    #canvas { display: none; }
    #scan-hint { margin-top: 1rem; font-size: 0.9rem; color: #888; }
    #stop-btn { margin-top: 1.2rem; background: none; border: 1px solid #555; color: #aaa; padding: 0.5rem 1.5rem; border-radius: 999px; cursor: pointer; font-size: 0.9rem; }
    #player-screen { display: none; flex-direction: column; align-items: center; }
    #player-screen.active { display: flex; }
    #play-btn { width: 130px; height: 130px; border-radius: 50%; background: #e94560; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s, background 0.2s; box-shadow: 0 0 50px rgba(233,69,96,0.45); touch-action: manipulation; }
    #play-btn:active { transform: scale(0.91); }
    #play-btn.playing { background: #16213e; box-shadow: 0 0 50px rgba(22,33,62,0.6); }
    #play-btn.loading { opacity: 0.5; pointer-events: none; }
    #play-btn svg { width: 52px; height: 52px; fill: #fff; }
    #msg { margin-top: 1.5rem; font-size: 1rem; color: #888; min-height: 1.4rem; text-align: center; padding: 0 2rem; }
    #new-scan-btn { margin-top: 2rem; background: none; border: 1px solid #555; color: #aaa; padding: 0.5rem 1.5rem; border-radius: 999px; cursor: pointer; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>FROBSTER</h1>
  <div id="scanner-screen">
    <button id="scan-btn" aria-label="Scan kaartje">
      <svg viewBox="0 0 24 24"><path d="M9.5 6.5v3h-3v-3h3M11 5H5v6h6V5zm-1.5 9.5v3h-3v-3h3M11 13H5v6h6v-6zm6.5-6.5v3h-3v-3h3M19 5h-6v6h6V5zm-6 8h1.5v1.5H13V13zm1.5 1.5H16V16h-1.5v-1.5zM16 13h1.5v1.5H16V13zm-3 3h1.5v1.5H13V16zm1.5 1.5H16V19h-1.5v-1.5zM16 16h1.5v1.5H16V16zm1.5-1.5H19V16h-1.5v-1.5zm0 3H19V19h-1.5v-1.5zM22 7h-2V4h-3V2h5v5zm0 15v-5h-2v3h-3v2h5zM2 22h5v-2H4v-3H2v5zM2 2v5h2V4h3V2H2z"/></svg>
    </button>
    <p id="scan-label">Scan een kaartje</p>
    <div id="camera-wrap">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="canvas"></canvas>
      <p id="scan-hint">Richt de camera op de QR-code</p>
      <button id="stop-btn">Annuleren</button>
    </div>
  </div>
  <div id="player-screen">
    <button id="play-btn" class="loading">
      <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
    </button>
    <div id="msg">Laden...</div>
    <button id="new-scan-btn">Nieuw kaartje scannen</button>
  </div>
  <audio id="audio"></audio>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    const scannerScreen = document.getElementById("scanner-screen");
    const playerScreen  = document.getElementById("player-screen");
    const cameraWrap    = document.getElementById("camera-wrap");
    const video         = document.getElementById("video");
    const canvas        = document.getElementById("canvas");
    const scanBtn       = document.getElementById("scan-btn");
    const scanLabel     = document.getElementById("scan-label");
    const stopBtn       = document.getElementById("stop-btn");
    const newScanBtn    = document.getElementById("new-scan-btn");
    const playBtn       = document.getElementById("play-btn");
    const msgEl         = document.getElementById("msg");
    const iconPlay      = document.getElementById("icon-play");
    const iconPause     = document.getElementById("icon-pause");
    const audio         = document.getElementById("audio");

    let stream = null, scanLoop = null, trackData = null;
    let searchVersion = 0; // voorkomt race conditions bij snel wisselen
    let lastScannedId = null;
    let scanCooldown = false;

    const params = new URLSearchParams(location.search);
    const urlId = params.get("id");

    fetch("data.json?v=" + Date.now())
      .then(r => r.json())
      .then(d => { trackData = d; if (urlId) startPlayer(urlId); });

    scanBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
    newScanBtn.addEventListener("click", () => {
      audio.pause();
      setPlaying(false);
      lastScannedId = null;
      playerScreen.classList.remove("active");
      scannerScreen.style.display = "flex";
    });

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(s => {
          stream = s;
          video.srcObject = s;
          cameraWrap.classList.add("active");
          scanBtn.style.display = "none";
          scanLabel.style.display = "none";
          scanCooldown = false;
          scanLoop = requestAnimationFrame(tick);
        })
        .catch(() => alert("Kan camera niet openen."));
    }

    function stopCamera() {
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      if (scanLoop) { cancelAnimationFrame(scanLoop); scanLoop = null; }
      cameraWrap.classList.remove("active");
      scanBtn.style.display = "";
      scanLabel.style.display = "";
    }

    function tick() {
      if (!scanCooldown && video.readyState === video.HAVE_ENOUGH_DATA) {
        const ctx = canvas.getContext("2d");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(img.data, img.width, img.height);
        if (code && code.data) {
          let id = null;
          try {
            const url = new URL(code.data);
            id = url.searchParams.get("id");
          } catch(e) {
            const m = code.data.match(/[?&]id=([^&]+)/);
            if (m) id = m[1];
          }
          if (id && id !== lastScannedId) {
            scanCooldown = true;
            lastScannedId = id;
            stopCamera();
            startPlayer(id);
            return;
          }
        }
      }
      scanLoop = requestAnimationFrame(tick);
    }

    function deezerSearch(song, artist) {
      return new Promise((resolve) => {
        const cb = "dz_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const q  = encodeURIComponent(artist + " " + song);
        const s  = document.createElement("script");
        s.src    = "https://api.deezer.com/search?q=" + q + "&limit=1&output=jsonp&callback=" + cb;
        let done = false;
        window[cb] = (data) => {
          if (done) return; done = true;
          delete window[cb]; s.remove();
          const preview = data && data.data && data.data[0] && data.data[0].preview;
          resolve(preview || null);
        };
        s.onerror = () => { if (done) return; done = true; delete window[cb]; s.remove(); resolve(null); };
        document.head.appendChild(s);
        setTimeout(() => { if (!done) { done = true; if (window[cb]) delete window[cb]; s.remove(); resolve(null); } }, 6000);
      });
    }

    async function startPlayer(id) {
      const myVersion = ++searchVersion;

      scannerScreen.style.display = "none";
      playerScreen.classList.add("active");
      playBtn.classList.add("loading");
      audio.pause();
      audio.src = "";
      setPlaying(false);
      msgEl.textContent = "Zoeken...";

      if (!trackData) {
        msgEl.textContent = "Data nog niet geladen, probeer opnieuw.";
        playBtn.classList.remove("loading");
        return;
      }

      const track = trackData.find(t => String(t.id) === String(id));
      if (!track) {
        msgEl.textContent = "Kaart " + id + " niet gevonden.";
        playBtn.classList.remove("loading");
        return;
      }

      const preview = await deezerSearch(track.song, track.artist);

      if (myVersion !== searchVersion) return; // nieuwere scan gestart

      if (preview) {
        audio.src = preview;
        msgEl.textContent = "Druk op play";
      } else {
        msgEl.textContent = "Geen preview voor dit nummer.";
      }
      playBtn.classList.remove("loading");
    }

    playBtn.addEventListener("click", () => {
      if (!audio.src || playBtn.classList.contains("loading")) return;
      if (audio.paused) {
        audio.play().then(() => setPlaying(true)).catch(() => { msgEl.textContent = "Afspelen mislukt."; });
      } else {
        audio.pause();
        setPlaying(false);
      }
    });

    audio.addEventListener("ended", () => setPlaying(false));

    function setPlaying(state) {
      iconPlay.style.display  = state ? "none" : "";
      iconPause.style.display = state ? ""     : "none";
      playBtn.classList.toggle("playing", state);
    }
  </script>
</body>
</html>
